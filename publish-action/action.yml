name: Publish QuizDock quizzes and themes
description: Validates the QuizDock quizzes and themes of a repository and publishes them, with their index, to a rolling release.
inputs:
  token:
    description: Token allowed to write releases.
    default: ${{ github.token }}
  directory:
    description: Folder holding the quiz folders.
    default: quizzes
  themes-directory:
    description: Folder holding the theme folders.
    default: themes
  max-mb:
    description: Largest bundle accepted, in MB.
    default: '20'
  tag:
    description: Tag of the rolling release.
    default: quizzes
runs:
  using: node24
  main: dist/action.mjs
